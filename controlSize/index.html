<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Size Control</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 20px;
      }
      p {
        margin: 20px 0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Control Paragraph Font Size</h1>
    <p id="text">
      This is a sample paragraph. Use the buttons below to adjust its font size.
    </p>
    <button id="increase">Increase Font Size</button>
    <button id="decrease">Decrease Font Size</button>

    <script>
      const text = document.getElementById("text");
      const increaseBtn = document.getElementById("increase");
      const decreaseBtn = document.getElementById("decrease");

      let fontSize = 16; // Initial font size in pixels

      increaseBtn.addEventListener("click", () => {
        fontSize += 2;
        text.style.fontSize = fontSize + "px";
      });

      decreaseBtn.addEventListener("click", () => {
        fontSize = Math.max(10, fontSize - 2); // Ensure font size doesn't go below 10px
        text.style.fontSize = fontSize + "px";
      });
    </script>
  </body>
</html>
