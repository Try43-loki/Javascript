<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .wrapper{

            width: 100%;
            padding:0px;
            margin: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper .body{

            border-radius: 10px;
            background-color: #ffff;

            border-radius: 5px;

        .wrapper .body .boxs{

        }
        .wrapper .body .box_first{
            width: 400px;
            height: 40px;
            display: flex;
            gap:10px;
            padding: 10px;
            align-items: center;
            justify-content: center;
        }
        .wrapper .body .box_first .box{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: #9effff;
            display: flex;
            align-items: center;
            text-align: center;
            box-shadow: 5px 5px 11px 0px #788888;
            justify-content: center;
            font-size: 18px;
        }

    <script>
        function StartAndStop(para){

                document.getElementById("startStop").innerHTML = "Start";
                document.getElementById("startStop").style.background = "#00ff00a6";   
            }
        }
