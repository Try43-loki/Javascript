<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function setCookie(cname, cvalue, exdays) 
        {
            const d = new Date();
            d.setTime(d.getTime() + (exdays*24*60*60*1000));
            let expires = "expires="+ d.toUTCString();
            document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
        }
        function getCookie(cname) 
        {
            let name = cname + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for(let i = 0; i <ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
                }
            }
            return "";
        }
        var abc;
        function setCookies(){
            var hh = document.getElementById("input").value;
            setCookie("input",hh,1);
            console.log(hh);
            console.log("Set Cookies successfully...");
            document.getElementsByClassName("inner")[0].innerHTML = "Cookie Set";
            document.getElementsByClassName("inner")[0].style.backGround = "green";
        }
        function getCookies(){
            abc = getCookie("input");
            console.log(abc);
            document.getElementsByClassName("inner")[0].innerHTML = abc;
            if(abc == ""){
                document.getElementsByClassName("inner")[0].innerHTML = "None";
            }
        }
        function ClearCookies(){
            let a = setCookie("input","",0);
            document.getElementsByClassName("inner")[0].innerHTML = "Cookie Clear";
         
        } 
    </script>
</head>
<body>
    <div class="wrapper">
        <div class="get">
            <input id="input" type="text" placeholder="Enter you name ">
            <button onclick="setCookies()">setCookie</button>
            <button onclick="getCookies()">getCookie</button>
            <button onclick="ClearCookies()">ClearCookie</button>
        </div>
        <div class="inner">
            ...
        </div>
    </div>
</body>
</html>
