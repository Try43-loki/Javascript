<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyUp</title>
    <script>
        function text(){
            let txt = document.getElementsByClassName("input_text")[0].value;
            document.getElementById("txt_result").innerHTML =  txt;
        }
    </script>
</head>
<body>
    <input class="input_text" onkeyup="text()" type="text" placeholder="Please input text">
    <hr>
    <h1 id="txt_result" >result</h1>
</body>
</html>
