<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .container{
      max-width: 100%;
    }
    .container .row .box{
      background-color:yellow;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color:white ;
      height: 260px;
      padding: 10px;
      position: relative;
    }
    .container .row .box:nth-child(2){
      background-color: cyan;
    }
    .container .row .box:nth-child(3){
      background-color: lightgreen;
    }
    .container .row .box:nth-child(4){
      background-color: chartreuse;
    }
    .container .row .img{
      object-fit: contain !important;
      height: 80%;
      max-width: 100%;
      display: flex;
      align-items: center;
    }
    .container .row p{
      position: absolute;
      background-color: rgba(255, 255, 255, 0.664);
      color:black;
      top: 217px;
    }
    
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="box col-xs-12 col-sm-6 col-md-4 col-lg-3">
       <img class="img img-thumnail" src="https://th.bing.com/th?id=OIP.e0sumWM3MMkx3addi-J28wHaF4&w=280&h=222&c=8&rs=1&qlt=90&o=6&dpr=1.6&pid=3.1&rm=2"/>
       <p>Cannonbolt</p>
      </div>
      <div class="box col-xs-12 col-sm-6 col-md-4 col-lg-3">
        <img class="img img-thumnail" src="https://th.bing.com/th?id=OIP.MJIIOr1_W0vPTJWiNrrWgAHaHc&w=249&h=250&c=8&rs=1&qlt=90&o=6&dpr=1.6&pid=3.1&rm=2"/>
        <p>Diamond hand</p>
      </div>
      <div class="box col-xs-12 col-sm-6 col-md-4 col-lg-3">
        <img class="img img-thumnail" src="https://th.bing.com/th?id=OIP.Zz2atn0x99Ci_ygQXH2UZQHaHM&w=253&h=246&c=8&rs=1&qlt=90&o=6&dpr=1.6&pid=3.1&rm=2"/>
        <p>XLR8</p>
      </div>
      <div class="box col-xs-12 col-sm-6 col-md-12 col-lg-3">
        <img class="img img-thumnail" src="https://th.bing.com/th?id=OIP.g_1bZ10wqYwN1i1_C8n8SwHaHp&w=245&h=254&c=8&rs=1&qlt=90&o=6&dpr=1.6&pid=3.1&rm=2"/>
        <p>Overflow</p>
      </div>
    </div>
  </div>
</body>
</html>
