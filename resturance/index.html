<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="position-relative w-full" style="height: 98vh">
    <button
      class="btn btn-dark position-absolute top-0 rounded-none d-none"
      style="right: 0"
      id="btnLogout"
    >
      Logout
    </button>
    <!-- FormLogin -->
    <section
      style="height: 100vh"
      class="container d-flex justify-center align-items-center flex-column"
      id="sectLogin"
    >
      <form action="" class="p-4 m-auto formLogin">
        <h2 class="text-center mb-4 text-primary fw-bold fs-1">Login</h2>
        <input
          id="username"
          type="text"
          placeholder="Enter Username"
          class="form-control mt-2"
        />
        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          class="form-control mt-3"
        />
        <button
          type="submit"
          id="btnSubmit"
          class="btn btn-primary mt-3 rounded-pill form-control"
        >
          Login
        </button>
      </form>
    </section>

    <!-- Admin -->

    <!-- Add Item form -->
    <section class="container d-none" id="wrapperItem">
      <div class="w-100 bg-primary px-3 py-2 mt-2">
        <h3 class="text-light text-center text-title"></h3>
      </div>
      <div id="wrapperBtn" class="d-flex align-items-center w-100 mt-3">
        <!-- Btn Add Product -->
        <button
          id="btnAddProduct"
          class="btn btn-success mb-2 mt-2 d-none"
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#staticBackdrop"
        >
          Add Product
        </button>
        <!-- Btn Show Cart -->
        <div class="showListCart bg-none d-none" id="wrapperCart">
          <i
            style="cursor: pointer"
            data-bs-toggle="offcanvas"
            data-bs-target="#canvas"
            class="fa-solid fa-cart-shopping fa-2x position-relative"
          >
            <span
              id="countCart"
              style="font-size: 11px"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              0
            </span>
          </i>
        </div>
        <!-- offcanvas show carts -->
        <div class="offcanvas offcanvas-end" id="canvas">
          <div class="offcanvas-header">
            <h4 class="offcanvas-title">Cart</h4>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body">
            <h5 class="text-center">Your cart items</h5>
            <hr />
            <ul
              class="mt-2 list-unstyled d-flex flex-column gap-3"
              id="listGroup"
            ></ul>
          </div>
          <div class="d-flex">
            <h2 class="text-primary fw-semibold m-0">
              Total :
              <p class="text-dark fw-medium m-0" id="totalPrice"></p>
            </h2>
          </div>
          <hr />
        </div>
      </div>
      <div
        class="modal fade"
        id="staticBackdrop"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-labelledby="staticBackdropLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="staticBackdropLabel">
                Add Product
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form action="" id="formProduct">
                <div
                  class="d-flex justify-content-center align-items-center gap-3"
                >
                  <input
                    id="nameProduct"
                    class="form-control"
                    type="text"
                    placeholder="Name product"
                  />
                  <input
                    id="price"
                    class="form-control"
                    type="text"
                    placeholder="Prize"
                  />
                </div>
                <div
                  class="d-flex justify-content-center align-items-center gap-3 mt-3"
                >
                  <input
                    id="quantity"
                    type="text"
                    placeholder="Quantity"
                    class="form-control"
                  />
                  <input
                    id="fileImage"
                    type="file"
                    accept="Image/*"
                    class="form-control mt-2"
                  />
                </div>
                <div>
                  <button
                    type="submit"
                    data-bs-dismiss="modal"
                    class="btn btn-success mt-2"
                    id="btnAddPd"
                  >
                    Save
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Item Display -->
    <section class="container d-none" id="itemDisplay">
      <ul class="showItem list-unstyled row"></ul>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
  </body>
</html>
