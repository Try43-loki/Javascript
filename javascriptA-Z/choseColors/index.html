<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choice Color</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="title">
        <p class="first">THE GREAT</p>
        <h3 class="color"></h3>
        <p class="first">GUSSING GAME</p>
      </div>
      <div class="menu">
        <p id="newColors">New Colors</p>
        <p id="answer"></p>
        <div class="level">
          <p id="win">Win : <span id="showWin">0</span></p>
          <p id="wrong">Lose : <span id="showLose">0</span></p>
          <p>Rate : <span id="showRate">0%</span></p>
        </div>
      </div>
      <div class="block-container">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
