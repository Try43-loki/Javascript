<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="title">
        <h2>This is Watch</h2>
      </div>
      <div class="time">
        <h2><span id="tens">00</span>:<span id="seconds">00</span></h2>
      </div>
      <div class="group-btn">
        <button id="start" class="btn">Start</button>
        <button id="stop" class="btn active">Stop</button>
        <button id="reset" class="btn">Reset</button>
        <script src="script.js"></script>
      </div>
    </div>
  </body>
</html>
