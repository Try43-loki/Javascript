<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Object</title>
  </head>
  <body>
    <h1 id="h1"></h1>
    <button class="btn">click</button>
  </body>
  <script>
    const h1 = document.querySelector("#h1");
    const btn = document.querySelector(".btn");
    const person = {
      name: "Mey soytry",
      age: 18,
      address: {
        live: "kandal",
        city: "phnomPenh",
        country: {
          code: "Cambodia",
          flage: "Khmer",
        },
      },
    };
    person.address.country.fly = "airplane"; //add value to object
    btn.addEventListener("click", () => {
      h1.innerHTML =
        person.name +
        " " +
        person.address.live +
        " " +
        person.address.country.code;
    });
  </script>
</html>
