<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="title">
        <h2 class="header">Shopping|MiniMart</h2>
      </div>
      <div class="product-wrapper">
        <div class="list-menu">
          <div class="list-wrapper">
            <ul>
              <li data-id="all" class="btn active">All</li>
              <li data-id="fruits" class="btn">Fruits</li>
              <li data-id="vegetables" class="btn">Vegetables</li>
              <li data-id="milks" class="btn">Milks</li>
              <li data-id="cheese" class="btn">Cheese</li>
            </ul>
          </div>
        </div>
        <div class="product-list">
            <div class="item-wrapper">
                <div class="img">
                    <img src="./img/apple.png" alt="">
                </div>
                <p class="title-item">Apple</p>
                <span class="price">10$</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
