<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Page</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="./css/style1.css" />
  </head>
  <body>
    <div class="sdtc-container">
      <nav>
        <div class="logo">
          <h3>SDTC</h3>
          <span class="toggle"
            ><i id="icon" class="fa fa-bars" aria-hidden="true"></i
          ></span>
        </div>
        <div class="ul-list">
          <ul>
            <li class="active-list"><a href="#">Personal</a></li>
            <li><a href="#">Experience</a></li>
            <li><a href="#">Achivement</a></li>
            <li><a href="#">Technology</a></li>
            <li><a href="#">Contact Us</a></li>
          </ul>
        </div>
        <div class="search-block">
          <input type="text" placeholder="search..." />
          <i id="search" class="fa fa-search" aria-hidden="true"></i>
        </div>
        <div class="enroll">
          <div class="sign">
            <i class="fa fa-user-plus" aria-hidden="true"></i>
            <p>Sign Up</p>
          </div>
          <div class="sign">
            <i class="fa fa-sign-in" aria-hidden="true"></i>
            <p>Sign In</p>
          </div>
        </div>
      </nav>
      <div class="body-wrapper">
        <div class="carousel">
          <div class="img">
            <img class="activer-img" src="./imgs/code3.png" alt="" />
            <img src="./imgs/code1.png" alt="" />
            <img src="./imgs/code6.png" alt="" />
            <img src="./imgs/code4.png" alt="" />
            <img src="./imgs/code5.png" alt="" />
          </div>
          <div class="btn-slider">
            <div class="prev-btn">
              <i class="fa fa-angle-left" aria-hidden="true"></i>
            </div>
            <div class="next-btn">
              <i class="fa fa-angle-right" aria-hidden="true"></i>
            </div>
          </div>
          <div class="dots">
            <div class="active-dot dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
        <div class="categores">
          <h2>Course Categories</h2>
          <div class="course-grid">
            <div class="course-btn">
              <i
                id="prev-btn-course"
                class="fa fa-arrow-left"
                aria-hidden="true"
              ></i>
              <i
                id="next-btn-course"
                class="fa fa-arrow-right"
                aria-hidden="true"
              ></i>
            </div>
            <div class="active-course course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
            <div class="course">
              <div class="img-icon">
                <img src="./imgs/codeIcon.png" alt="" />
              </div>
              <span>Web Design</span>
            </div>
          </div>
        </div>
      </div>
      <footer></footer>
    </div>
    <script src="./js/jquery.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
