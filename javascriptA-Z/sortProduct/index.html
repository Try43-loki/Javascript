<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Shop</h2>
      <div class="wrapper">
        <div class="menu-list">
          <div class="ul-list">
            <ul class="ul-list-item">
              <li data-id="all" class="li-style active">All</li>
              <li data-id="fruits" class="li-style">Fruits</li>
              <li data-id="vegetables" class="li-style">Vegetables</li>
              <li data-id="meats" class="li-style">Meat</li>
              <li data-id="fish" class="li-style">Fish</li>
              <li data-id="coke" class="li-style">Coke</li>
            </ul>
          </div>
        </div>
        <div class="product-list">
          <div class="item-wrapper">
            <img class="img" src="./img/apple.png" alt="" />
            <h3 class="name-product">Apple</h3>
            <span class="price">10$</span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
