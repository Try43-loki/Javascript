    const obj = { name: "soytry", age: 19 };
    getObj("soytry")
      .then((resp) => console.log(resp))
      .catch((err) => console.log(err));
    function getObj(name) {
      return new Promise((resolve, reject) => {
        const result = obj.name === name;
        if (result) {
          resolve(name);
        } else {
          reject("something went wrong");
        }
      });
    }
