<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Card | page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.css"
      integrity="sha512-3pIirOrwegjM6erE5gPSwkUzO+3cTjpnV9lexlNZqvupR64iZBnOOTiiLPb9M36zpMScbmUNIcHUqKD47M719g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="container d-flex justify-center align-items-center">
      <form
        id="formLogin"
        action=""
        class="bg-white rounded-lg shadow-lg p-5 w-50 mx-auto"
      >
        <h1 class="fs-3 text-center">Login</h1>
        <div class="mt-3">
          <label for="user">Username : </label>
          <input
            class="form-control"
            id="user"
            type="text"
            placeholder="Enter username"
          />
        </div>
        <div class="mt-3">
          <label for="pass">Password : </label>
          <input
            class="form-control"
            id="pass"
            type="text"
            placeholder="Enter password"
          />
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
      </form>
    </section>
    <section class="container">
      <!-- Modal -->
      <div
        class="modal fade"
        id="staticBackdrop"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-labelledby="staticBackdropLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="staticBackdropLabel">
                Add Product
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form action="" id="formSubmit">
                <div
                  class="d-flex justify-content-center align-items-center gap-3"
                >
                  <input
                    id="inputName"
                    class="form-control"
                    type="text"
                    placeholder="Name product"
                  />
                  <input
                    id="inputPrize"
                    class="form-control"
                    type="text"
                    placeholder="Prize"
                  />
                </div>
                <div
                  class="d-flex justify-content-center align-items-center gap-3 mt-3"
                >
                  <input
                    id="inputQty"
                    type="text"
                    placeholder="Quantity"
                    class="form-control"
                  />
                  <input
                    id="inputFile"
                    type="file"
                    accept="Image/*"
                    class="form-control mt-2"
                  />
                </div>
                <div>
                  <button
                    type="submit"
                    data-bs-dismiss="modal"
                    class="btn btn-success mt-2"
                    id="btnSubmit"
                  >
                    Save
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <main class="row mt-2"></main>
    </section>
    <section class="container" id="sectionContent">
      <h1 class="titleContent text-center"></h1>
      <div id="adminPage">
        <h1 class="text-center text-primary">Add Product</h1>
        <button
          class="btn btn-success btn-sm mb-2"
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#staticBackdrop"
        >
          Add
        </button>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"
      integrity="sha512-VEd+nq25CkR676O+pLBnDW09R7VQX9Mdiij052gVCp5yVH3jGtH70Ho/UUv4mJDsEdTvqRCFZg0NKGiojGnUCw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
  </body>
</html>
