<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>Table Data</title>
  </head>
  <body>
    <!-- header -->
    <section class="container">
      <h1 class="fs-4 text-center">Table Data Employee</h1>
      <div class="w-100 d-flex justify-content-evenly align-item-center mt-4">
        <h2 class="fs-5 text-primary">List Employees</h2>

        <button
          type="button"
          class="btn btn-outline-primary"
          data-bs-toggle="modal"
          data-bs-target="#staticBackdrop"
        >
          Add Employee
        </button>

        <!-- Modal -->
        <div
          class="modal fade"
          id="staticBackdrop"
          data-bs-backdrop="static"
          data-bs-keyboard="false"
          tabindex="-1"
          aria-labelledby="staticBackdropLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">
                  Field the Blank
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form
                  action=""
                  id="formModal"
                  class="flex justify-content-center align-items-center flex-column gap-3"
                >
                  <div
                    class="d-flex justify-content-between align-items-center gap-3"
                  >
                    <input
                      type="text"
                      class="form-control"
                      name=""
                      id="firstname"
                      placeholder="Firstname"
                    />
                    <input
                      type="text"
                      class="form-control"
                      name=""
                      id="lastname"
                      placeholder="Lastname"
                    />
                  </div>
                  <div
                    class="d-flex justify-content-between align-items-center gap-3 mt-2"
                  >
                    <input
                      type="text"
                      class="form-control"
                      name=""
                      id="id"
                      placeholder="ID"
                    />
                    <input
                      type="text"
                      list="sex"
                      name="sex"
                      placeholder="Sex"
                      class="form-control"
                    />
                    <datalist id="sex">
                      <option value="Main">Main</option>
                      <option value="Female">Female</option>
                      <option value="Other">Other</option>
                    </datalist>
                  </div>
                  <input
                    type="text"
                    class="form-control mt-2"
                    placeholder="Position"
                    id="position"
                  />

                  <img
                    src="https://fakeimg.pl/200x200/"
                    height="200"
                    width="200"
                    class="mx-auto my-4 d-flex"
                    id="picFile"
                    alt=""
                  />
                  <div class="input-group mt-2">
                    <input type="file" class="form-control" id="objfile" />
                    <label class="input-group-text" for="inputGroupFile02"
                      >Upload</label
                    >
                  </div>
                  <button
                    type="button"
                    id="btnAdd"
                    class="btn btn-sm btn-primary mt-2 w-100 p-2"
                    data-bs-dismiss="modal"
                  >
                    Submit
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <table class="table table-hover table-responsive">
        <thead>
          <tr>
            <th scope="col">Profile</th>
            <th scope="col">ID</th>
            <th scope="col">Fullname</th>
            <th scope="col">Gender</th>
            <th scope="col">Position</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">
              <img src="imgs/boys.png" height="30" width="30" alt="" />
            </th>
            <td>101</td>
            <td>Dara</td>
            <td>Male</td>
            <td>Web</td>
            <td class="d-flex align-items-center gap-2">
              <button class="btn btn-sm btn-success">Update</button>
              <button class="btn btn-sm btn-danger">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
  </body>
</html>
