<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Count | page</title>
  </head>
  <body>
    <section class="container">
      <h3 class="text-center mt-2">Add to Card</h3>
      <div class="d-flex justify-content-end align-items-center">
        <i
          style="cursor: pointer"
          data-bs-toggle="offcanvas"
          data-bs-target="#canvas"
          class="fa-solid fa-cart-shopping fa-2x position-relative"
        >
          <span
            id="countCart"
            style="font-size: 11px"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            0
          </span>
        </i>
      </div>
      <div class="row">
        <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3">
          <div class="card">
            <div class="card-header">
              <img
                src="https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
                class="img-fluid"
                alt=""
              />
            </div>
            <div class="card-body">
              <h5>Name : Pasta</h5>
              <h5>Price : $9.99</h5>
            </div>
            <div class="card-footer">
              <button
                data-id="1"
                data-price="9.99"
                data-name="paster"
                data-img="https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
                class="btnAdd btn btn-primary form-control rounded-pill"
              >
                Add to cart
              </button>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3">
          <div class="card">
            <div class="card-header">
              <img
                src="https://images.pexels.com/photos/1099680/pexels-photo-1099680.jpeg?auto=compress&cs=tinysrgb&w=600"
                class="img-fluid"
                alt=""
              />
            </div>
            <div class="card-body">
              <h5>Name : Pasta</h5>
              <h5>Price : $19.99</h5>
            </div>
            <div class="card-footer">
              <button
                data-id="2"
                data-price="19.99"
                data-name="desserts"
                data-img="https://images.pexels.com/photos/1099680/pexels-photo-1099680.jpeg?auto=compress&cs=tinysrgb&w=600"
                class="btnAdd btn btn-primary form-control rounded-pill"
              >
                Add to cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="offcanvas offcanvas-end" id="canvas">
      <div class="offcanvas-header">
        <h3 class="offcanvas-title">Control Cart</h3>
        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <h4>Your cart items</h4>
        <hr />
        <ul
          class="mt-2 list-unstyled d-flex flex-column gap-3"
          id="listGroup"
        ></ul>
        <h3>Total : <span id="totalPay"></span></h3>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
  </body>
</html>
