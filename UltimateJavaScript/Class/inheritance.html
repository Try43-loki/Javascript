<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class User {
        constructor(id, name, email) {
          this.name = name;
          this.id = id;
          this.email = email;
        }
        changeEmail(newEmail) {
          this.email = newEmail;
        }
      }
      class Admin extends User {
        constructor(id, name, email) {
          super(id, name, email);
          this.role = "Admin";
        }
      }

      const adminOne = new Admin(1, "Try", "@gmail.com");
      adminOne.changeEmail("hog@gmail.com");
      console.log(adminOne);
      const user = new User(101, "Dara", "@dara");
      console.log(user);
    </script>
  </body>
</html>
