  <body>
    <script>
      const currency = (strs, ...para) => {
        const all = strs.concat(para);
        console.log(all);
        return `Word count is ${all.length}`;
      };
      const names = "Soytry";
      const price = "ninety nine";

      console.log(total); // Output: "The total price is $19.99"
    </script>
