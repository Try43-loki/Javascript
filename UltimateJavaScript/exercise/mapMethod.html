<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Data</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script
      defer
      src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <style>
      #boom {
        transition: 0.3s ease-in-out;
      }
      #boom:active {
        transform: scale(0.8);
        transition: 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <section
      id="container"
      class="container-fluid mx-auto mt-5 d-flex flex-wrap gap-3 justify-content-center align-items-center px-5"
    ></section>
    <section class="container-fluid mt-5">
      <button
        id="boom"
        class="btn btn-warning d-block px-2 py-3 fw-medium fs-2 mx-auto"
      >
        BOOM!
      </button>
    </section>
    <script>
      const container = document.querySelector("#container");
      const dataCars = [
        { brand: "bmw", price: 20000 },
        { brand: "Toyota", price: 15000 },
        { brand: "RollRoy", price: 100000 },
        { brand: "nissan", price: 50000 },
        { brand: "audi", price: 80000 },
        { brand: "Ford", price: 11000 },
        { brand: "Lamboghini", price: 200000 },
        { brand: "Luxus", price: 80000 },
      ];
      const sortData = dataCars.sort((a, b) => a.brand.localeCompare(b.brand));
      const boomBtn = document.querySelector("#boom");

      boomBtn.addEventListener("dblclick", () => {
        if (container.innerHTML == "") {
          const newData = sortData
            .map((items) => {
              return `<button class="btn btn-warning px-2 py-3"><article><h1 class="text-light fw-bold fs-4 text-uppercase">${items.brand}</h1><p class="text-light fw-medium fs-5 m-0">$${items.price}</p><p class="text-light fw-light fs-5 text-lowercase ">${items.brand}@gmail.com</p></article></button>`;
            })
            .join("");
          container.innerHTML = newData;
        } else {
          container.innerHTML = "";
        }
      });
    </script>
  </body>
</html>
