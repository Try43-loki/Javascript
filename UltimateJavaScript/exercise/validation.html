<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Form Validation Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex justify-center items-center h-screen bg-blue-200">
    <div class="flex flex-col justify-center w-[500px]">
      <form
        id="signup"
        class="form flex flex-col justify-center items-start gap-5 rounded-md border-2 border-blue-500 p-10 bg-[#368cd6a9] backdrop-blur-md w-full"
      >
        <h1 class="text-2xl font-bold text-black text-center m-auto">
          Sign Up
        </h1>
        <div
          class="form-field flex justify-between items-center w-full relative"
        >
          <label
            class="text-slate-100 transition-opacity duration-200 ease-linear"
            for="username"
            >Username:</label
          >
          <input
            class="outline-none px-3 py-2 rounded-md bg-inherit border-b-2 focus:shadow-sm focus:shadow-white transition-all duration-200 ease-linear text-white"
            type="text"
            name="username"
            id="username"
            autocomplete="off"
          />
          <small class="absolute right-0 bottom-[-25px] text-gray-200"></small>
        </div>

        <div
          class="form-field flex justify-between items-center w-full relative"
        >
          <label
            class="text-slate-100 transition-opacity duration-200 ease-linear"
            for="email"
            >Email:</label
          >
          <input
            class="outline-none px-3 py-2 rounded-md bg-inherit border-b-2 focus:shadow-sm focus:shadow-white transition-all duration-200 ease-linear text-white"
            type="text"
            name="email"
            id="email"
            autocomplete="off"
          />
          <small class="absolute right-0 bottom-[-25px] text-gray-200"></small>
        </div>

        <div
          class="form-field flex justify-between items-center w-full relative"
        >
          <label
            class="text-slate-100 opacity-[.8] group-active::opacity-100 transition-opacity duration-200 ease-linear"
            for="password"
            >Password:</label
          >
          <input
            class="outline-none px-3 py-2 rounded-md bg-inherit border-b-2 focus:shadow-sm focus:shadow-white transition-all duration-200 ease-linear text-white"
            type="password"
            name="password"
            id="password"
            autocomplete="off"
          />
          <small class="absolute right-0 bottom-[-25px] text-gray-200"></small>
        </div>

        <div
          class="form-field flex justify-between items-center w-full relative"
        >
          <label
            class="text-slate-100 opacity-[.8] group-focus:opacity-100 transition-opacity duration-200 ease-linear"
            for="confirm-password"
            >Confirm Password:</label
          >
          <input
            class="outline-none px-3 py-2 rounded-md bg-inherit border-b-2 focus:shadow-sm focus:shadow-white transition-all duration-200 ease-linear text-white"
            type="password"
            name="confirm-password"
            id="confirm-password"
            autocomplete="off"
          />
          <small class="absolute right-0 bottom-[-25px] text-gray-200"></small>
        </div>

        <div
          class="form-field flex justify-between items-center w-full relative"
        >
          <input
            class="mt-10 px-3 py-2 bg-blue-50 rounded-md font-medium text-xl shadow-md shadow-white m-auto active:bg-gray-200"
            type="submit"
            value="Sign Up"
          />
        </div>
      </form>
    </div>
    <script>
      const usernameEl = document.querySelector("#username");
      const emailEl = document.querySelector("#email");
      const passwordEl = document.querySelector("#password");
      const confirmPasswordEl = document.querySelector("#confirm-password");

      const form = document.querySelector("#signup");

      const checkUsername = () => {
        let valid = false;

        const min = 3,
          max = 25;

        const username = usernameEl.value.trim();

        if (!isRequired(username)) {
          showError(usernameEl, "Username cannot be blank.");
        } else if (!isBetween(username.length, min, max)) {
          showError(
            usernameEl,
            `Username must be between ${min} and ${max} characters.`
          );
        } else {
          showSuccess(usernameEl);
          valid = true;
        }
        return valid;
      };

      const checkEmail = () => {
        let valid = false;
        const email = emailEl.value.trim();
        if (!isRequired(email)) {
          showError(emailEl, "Email cannot be blank.");
        } else if (!isEmailValid(email)) {
          showError(emailEl, "Email is not valid.");
        } else {
          showSuccess(emailEl);
          valid = true;
        }
        return valid;
      };

      const checkPassword = () => {
        let valid = false;

        const password = passwordEl.value.trim();

        if (!isRequired(password)) {
          showError(passwordEl, "Password cannot be blank.");
        } else if (!isPasswordSecure(password)) {
          showError(
            passwordEl,
            "Password must has at least 8 characters that include at least 1 lowercase character, 1 uppercase characters, 1 number, and 1 special character in (!@#$%^&*)"
          );
        } else {
          showSuccess(passwordEl);
          valid = true;
        }

        return valid;
      };

      const checkConfirmPassword = () => {
        let valid = false;
        // check confirm password
        const confirmPassword = confirmPasswordEl.value.trim();
        const password = passwordEl.value.trim();

        if (!isRequired(confirmPassword)) {
          showError(confirmPasswordEl, "Please enter the password again");
        } else if (password !== confirmPassword) {
          showError(confirmPasswordEl, "The password does not match");
        } else {
          showSuccess(confirmPasswordEl);
          valid = true;
        }

        return valid;
      };

      const isEmailValid = (email) => {
        const re =
          /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
        return re.test(email);
      };

      const isPasswordSecure = (password) => {
        const re = new RegExp(
          "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\$%\^&\*])(?=.{8,})"
        );
        return re.test(password);
      };

      const isRequired = (value) => (value === "" ? false : true);
      const isBetween = (length, min, max) =>
        length < min || length > max ? false : true;

      const showError = (input, message) => {
        // get the form-field element
        const formField = input.parentElement;
        // add the error class
        formField.classList.remove("success");
        formField.classList.add("error");

        // show the error message
        const error = formField.querySelector("small");
        error.textContent = message;
      };

      const showSuccess = (input) => {
        // get the form-field element
        const formField = input.parentElement;

        // remove the error class
        formField.classList.remove("error");
        formField.classList.add("success");

        // hide the error message
        const error = formField.querySelector("small");
        error.textContent = "";
      };

      form.addEventListener("submit", function (e) {
        // prevent the form from submitting
        e.preventDefault();

        // validate fields
        let isUsernameValid = checkUsername(),
          isEmailValid = checkEmail(),
          isPasswordValid = checkPassword(),
          isConfirmPasswordValid = checkConfirmPassword();

        let isFormValid =
          isUsernameValid &&
          isEmailValid &&
          isPasswordValid &&
          isConfirmPasswordValid;

        // submit to the server if the form is valid
        if (isFormValid) {
        }
      });

      const debounce = (fn, delay = 500) => {
        let timeoutId;
        return (...args) => {
          // cancel the previous timer
          if (timeoutId) {
            clearTimeout(timeoutId);
          }
          // setup a new timer
          timeoutId = setTimeout(() => {
            fn.apply(null, args);
          }, delay);
        };
      };

      form.addEventListener(
        "input",
        debounce(function (e) {
          switch (e.target.id) {
            case "username":
              checkUsername();
              break;
            case "email":
              checkEmail();
              break;
            case "password":
              checkPassword();
              break;
            case "confirm-password":
              checkConfirmPassword();
              break;
          }
        })
      );
    </script>
  </body>
</html>
