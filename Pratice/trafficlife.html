<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic | light</title>
    <style>
        body{
            padding: 0px;
            margin:0px;
            background-color: rgba(0, 0, 0, 0.772);
        }
        .wrapper{
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper .time{
            width:100px;
            height: 50px;
            border:1px solid black;
            margin-right: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper .box{
            width:80px;
            height: 140px;
            border:1px solid black;
            align-items: center;
            justify-content: space-around;
            display: flex;
            flex-direction: column;
        }
        .wrapper .box .box1{
            height: 40px;
            width: 40px;
            border-radius: 50%;
            border:1px solid black;
        }
        #red{
            background-color: rgba(255, 0, 0, .5);
        }
        #yellow{
            background-color: rgba(255, 255, 0, 0.5);
        }
        
        #green{
            background-color: rgba(26, 255, 0, 0.578);
        }
    </style>
    <script>
        var pct =10;
        var pct1 = 3;
        var timer = setInterval(loading,1000);
        function loading(){
            pct -=1;
            document.getElementsByClassName("time")[0].innerHTML = pct;
            document.getElementsByClassName("time")[0].style.color = "rgb(26, 255, 0)";
            if(pct <10 && pct >=1){
                document.getElementById("green").style.backgroundColor="hsl(114, 100%, 50%)";
            }
            if(pct == 1){
                clearInterval(timer);
                document.getElementById("green").style.backgroundColor="rgba(26, 255, 0, 0.578)";
            }
        }
         var timer1 = setInterval(loading1,1000);
        function loading1(){
            pct1 -=1;
            document.getElementsByClassName("time")[0].innerHTML = pct;
            document.getElementsByClassName("time")[0].style.color = "orange";
            if(pct1 <10 && pct1 >=1){
                document.getElementById("green").style.backgroundColor="hsl(114, 100%, 50%)";
            }
        }
        
    </script>
</head>
<body>
    <div class="wrapper">
        <div class="time">
            ...
        </div>
        <div class="box">
            <div class="box1" id="red">

            </div>
            <div class="box1" id="yellow">
                
            </div>
            <div class="box1" id="green">
                
            </div>
        </div>
    </div>
</body>
</html>
