<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise all</title>
</head>
<body>
    <script>
        function fetchUser (){
            const user = {id : 1 , name : "Try" , email : "example@example.com"}
            return new Promise ((resolve,reject)=>{
                if(user != null){
                    resolve(user)
                }else {
                    reject("User not found")
                }
            })
        }

        function fetchOrder(){
            const orders = [{orderID : 101, name : "Phone", price : 1000},{orderID : 102, name : "Laptop", price : 2000}];
            return new Promise ((resolve, reject)=>{
                if(orders){
                    resolve(orders)
                }else{
                    reject("No orders found")
                }
            })
        }

        function fetchMessages(){
            const massage = ["Successful", "Your welcome"];
            return new Promise ((resolve, reject)=>{
                if(massage){
                    resolve(massage);
                }else{
                    reject("No messages found")
                }
            })

        }

        Promise.all([fetchUser(),fetchOrder(),fetchMessages()])
        .then(([user,order,massage])=>{
             console.log("User:",user.name);
             console.log("Order:",order[0].name);
             console.log("Messages:",massage[0]);
        })
        .catch((error)=>{
             console.error("Error:",error);
 
        })
        
    </script>
</body>
</html>
