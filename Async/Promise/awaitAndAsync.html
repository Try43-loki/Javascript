<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Await / Async</title>
  </head>
  <body>
    <script>
      // return promise function
      const readBook = (nameBooks, duration) => {
        return new Promise((resolve, reject) => {
          if (nameBooks) {
            setTimeout(() => {
              resolve(`You reading ${nameBooks}`);
            }, duration);
          } else {
            reject("You don't read any books");
          }
        });
      };
      const playVideoGame = (nameGame, duration) => {
        return new Promise((resolve, reject) => {
          if (nameGame) {
            setTimeout(() => {
              resolve(`You playing ${nameGame}`);
            }, duration);
          } else {
            reject("You don't play any video game");
          }
        });
      };
      const programming = (language, duration) => {
        return new Promise((resolve, reject) => {
          if (language) {
            setInterval(() => {
              resolve(`You studying ${language}`);
            }, duration);
          } else {
            reject("You don't study any programming language");
          }
        });
      };

      const activity = async () => {
        try {
            console.log("Good Morning");
          const read = await readBook("Follow your heart", 1500);
          console.log(read);
          const playGame = await playVideoGame("efootball", 2000);
          console.log(playGame);
          const study = await programming("JavaScript", 2000);
          console.log(study);
          console.log("Good Night");
        } catch (err) {
          console.error(err);
        }
      };
      activity();
    </script>
  </body>
</html>
