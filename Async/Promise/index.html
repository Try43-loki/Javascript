<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>
<body>
    <script>

        const promise = new Promise ((resolve,reject)=>{
            const companies = ["Toyota","Ford"];
            if(companies.length > 0){
                resolve(companies);
            }else{
                reject('No companies found');
            }
        })
        promise.then((company)=>{
            console.log(company);
        }).catch((error)=>{
            console.error(error);
        })

    </script>
</body>
</html>
