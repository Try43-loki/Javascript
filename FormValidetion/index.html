<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form Validation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <form class="was-validated">
        <div class="mb-3">
          <label for="inputEmail" class="form-label">Email address</label>
          <input
            id="inputEmail"
            type="email"
            class="form-control"
            aria-describedby="emailHelp"
            required
          />
          <div id="emailHelp" class="form-text">
            We'll never share your email with anyone else.
          </div>
          <div class="valid-feedback">Email valid</div>
          <div class="invalid-feedback">Email Invalid</div>
        </div>
        <div class="mb-3">
          <label for="inputPassword" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="inputPassword"
            required
          />
          <div class="valid-feedback">Password valid</div>
          <div class="invalid-feedback">Password Invalid</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
    <script>
      const inputEmail = document.querySelector("#inputEmail");
      const inputPassword = document.querySelector("#inputPassword");
      const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const regexPassword = /^[0-9a-zA-Z#,*,$,%]{8,}$/;

      inputEmail.addEventListener("input", () => {
        if (regexEmail.test(inputEmail.value)) {
          inputEmail.classList.add("valid-feedback");
          inputEmail.classList.remove("invalid-feedback");
        } else {
          inputEmail.classList.remove("valid-feedback");
          inputEmail.classList.add("invalid-feedback");
        }
      });

      inputPassword.addEventListener("input", () => {
        if (regexPassword.test(inputPassword.value)) {
          inputPassword.classList.add("valid-feedback");
          inputPassword.classList.remove("invalid-feedback");
        } else {
          inputPassword.classList.remove("invalid-feedback");
          inputPassword.classList.add("valid-feedback");
        }
      });
      const isEmail = regexEmail.test(inputEmail.value);
      const isPassword = regexPassword.test(inputPassword.value);
      const form = document.querySelector("form");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (isEmail && isPassword) {
          Swal.fire({
            icon: "success",
            title: "Correctly filled form",
            text: "Success",
          });
        } else {
          Swal.fire({
            icon: "error",
            title: "Oops...",
            text: "Something went wrong!",
            footer: '<a href="#">Why do I have this issue?</a>',
          });
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
